name: quickbench

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'edge/**'
      - 'benches/**'
      - 'scripts/quickbench.sh'
      - 'scripts/report.py'
      - 'scripts/economics.py'
      - 'Cargo.toml'
      - 'Cargo.lock'

jobs:
  bench:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
      
      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      
      - name: Run quickbench
        run: |
          chmod +x scripts/quickbench.sh
          ./scripts/quickbench.sh
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: luxi-bench-artifacts
          path: |
            artifacts/**
            telemetry/**
          retention-days: 30
      
      - name: Display results summary
        if: always()
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f artifacts/bench_summary.md ]; then
            cat artifacts/bench_summary.md >> $GITHUB_STEP_SUMMARY
          else
            echo "Benchmark summary not generated" >> $GITHUB_STEP_SUMMARY
          fi
