name: Sync Marketing Docs

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'MARKETING_*.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          
      - name: Copy marketing-site for mirror
        run: |
          mkdir -p marketing-sync
          cp -r marketing-site/* marketing-sync/

      - name: Push marketing-site to public mirror
        uses: ad-m/github-push-action@v0.6.0
        with:
          repository: RegularJoe-CEO/erock-marketing
          branch: main
          github_token: ${{ secrets.MIRROR_TOKEN }}
          force: true
          directory: marketing-sync