name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            ext: ""
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64
            ext: ""
          - os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            platform: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilers
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-gnu" ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64
          fi

      - name: Build binaries
        working-directory: build
        env:
          LUXI_BUILD_EPOCH: ${{ github.run_id }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          TARGET_DIR="build/target/${{ matrix.target }}/release"
          mkdir -p release-assets
          for bin in luxiedge-lite luxiedge-demo luxi-tools; do
            src="$TARGET_DIR/${bin}${{ matrix.ext }}"
            dst="release-assets/${bin}-${{ matrix.platform }}${{ matrix.ext }}"
            cp "$src" "$dst"
            sha256sum "$dst" > "release-assets/${bin}-${{ matrix.platform }}.sha256"
          done
          if [ "${{ matrix.platform }}" = "linux-x86_64" ]; then
            cp release-assets/luxiedge-demo-linux-x86_64 release-assets/luxiedge-demo-linux-x86_64-gpu
            cp release-assets/luxiedge-demo-linux-x86_64.sha256 release-assets/luxiedge-demo-linux-x86_64-gpu.sha256
            cp release-assets/luxiedge-lite-linux-x86_64 release-assets/luxiedge-lite-linux-x86_64-gpu
            cp release-assets/luxiedge-lite-linux-x86_64.sha256 release-assets/luxiedge-lite-linux-x86_64-gpu.sha256
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.platform }}
          path: release-assets/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: v3.0 Full Demo Binaries
          files: artifacts/*