name: Sync Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        default: 'v3.0'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download binaries from private build repo
        env:
          GH_TOKEN: ${{ secrets.LUXIEDGE_V2_TOKEN }}
        run: |
          mkdir -p ./binaries
          gh release download ${{ github.event.inputs.tag }} \
            --repo RegularJoe-CEO/LuxiEdge-v2 \
            --pattern 'luxiedge-*' \
            --pattern 'luxi-tools-*' \
            --dir ./binaries || true

      - name: Upload binaries only to LuxiDemo release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(ls -A ./binaries 2>/dev/null)" ]; then
            echo "No binaries found. Upload manually or check LuxiEdge-v2 release."
            exit 1
          fi
          gh release upload ${{ github.event.inputs.tag }} \
            --repo RegularJoe-CEO/LuxiDemo \
            ./binaries/* \
            --clobber