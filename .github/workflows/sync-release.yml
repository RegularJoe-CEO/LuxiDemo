name: Sync Release from LuxiEdge-v2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to sync'
        required: true
        default: 'v2.0.0'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download binaries from LuxiEdge-v2
        env:
          GH_TOKEN: ${{ secrets.LUXIEDGE_V2_TOKEN }}
        run: |
          gh release download ${{ github.event.inputs.tag }} \
            --repo RegularJoe-CEO/LuxiEdge-v2 \
            --pattern 'luxiedge-*' \
            --dir ./binaries

      - name: Upload to LuxiDemo release
        env:
          GH_TOKEN: ${{ secrets.LUXIEDGE_V2_TOKEN }}
        run: |
          gh release delete ${{ github.event.inputs.tag }} --repo RegularJoe-CEO/LuxiDemo --yes || true
          gh release create ${{ github.event.inputs.tag }} \
            --repo RegularJoe-CEO/LuxiDemo \
            --title "LuxiEdge ${{ github.event.inputs.tag }}" \
            --notes "Synced from LuxiEdge-v2" \
            ./binaries/*
