[package]
name = "luxi-demo-build"
version = "3.0.0"
edition = "2021"
authors = ["Eric Waller <e@ewaller.com>"]
description = "Luxi public demo binaries"

[lib]
name = "luxi_demo_build"
path = "src/lib.rs"

[features]
default = []
gpu = ["cudarc", "half"]
std = []

[[bin]]
name = "luxiedge-lite"
path = "src/bin/luxiedge_lite.rs"

[[bin]]
name = "luxiedge-demo"
path = "src/bin/luxiedge_demo.rs"

[[bin]]
name = "luxi-tools"
path = "src/bin/luxi_tools.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
sha2 = "0.10"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
attention-transformer = { path = "vendor/attention-transformer", default-features = false, features = ["std"] }
half = { version = "2", optional = true }
cudarc = { version = "0.11", optional = true, features = ["driver", "cuda-12040"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3