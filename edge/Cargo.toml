[package]
name = "erock_edge"
license-file = "../LICENSE"
readme = "../README.md"
repository = "https://github.com/RegularJoe-CEO/LuxiEdge"
homepage = "https://github.com/RegularJoe-CEO/LuxiEdge"
documentation = "https://github.com/RegularJoe-CEO/LuxiEdge/blob/main/docs/README.md"
keywords = ["axum","http-server","api"]
categories = ["web-programming::http-server"]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Luxi-Business-1.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
# Use hyper 0.14 API to match current server code (make_service_fn, Body, Server)
hyper = { version = "0.14", features = ["http1", "server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# Link to the workspace library crate so `use erock::...` resolves
erock = { path = ".." }
