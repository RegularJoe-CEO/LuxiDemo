[package]
name = "erock"
version = "0.1.0"
edition = "2021"

[dependencies]
rhai = "=1.18.0"
warp = "0.3"
nom = "7.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
faer = "0.18"
nalgebra = "0.32"
cudarc = { version = "0.17.7", optional = true }
wgpu = { version = "0.19", optional = true }

[features]
default = []
gpu = ["cudarc", "wgpu"]

[dev-dependencies]
criterion = "0.7.0"

[[bench]]
name = "edge_suite"
harness = false

[[bench]]
name = "my_benchmark"
harness = false

[[bench]]
name = "simd_vs_scalar"
harness = false

[[bench]]
name = "repro"
harness = false
