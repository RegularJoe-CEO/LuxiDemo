[package]
name = "luxiedge"
version = "0.1.0"
authors = ["LuxiEdge Contributors"]
edition = "2021"

[lib]
name = "luxiedge"
path = "src/lib.rs"

[[bin]]
name = "luxiedge-server"
path = "src/bin/luxiedge-server.rs"

[[bin]]
name = "test_quant"
path = "src/bin/test_quant.rs"

[features]
default = []
gpu = ["cudarc", "half"]

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
sha2 = "0.10.9"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = { version = "2", optional = true }
cudarc = { version = "0.11", optional = true, features = ["driver", "cuda-12040"] }
