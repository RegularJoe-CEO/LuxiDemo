[package]
name = "erock"
version = "0.1.0"
edition = "2021"

[dependencies]
rhai = { version = "1.16", features = ["sync"] }
tonic = "0.10"
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
wide = "0.7"          # SIMD f32x4/f64x2 vectors (4x parallel eval)
simdeez = "1.0"       # Cross-platform SIMD intrinsics/detection
