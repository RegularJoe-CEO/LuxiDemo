[package]
name = "erock"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
rhai = "1.23.4"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
axum = { version = "0.8.6", features = ["macros"] }

[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "erock_client"
path = "src/bin/erock_client.rs"

[[bench]]
name = "my_benchmark"
harness = false

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
