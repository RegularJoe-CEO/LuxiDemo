[workspace]
members = [
    "edge",
]
resolver = "2"

[package]
name = "erock"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Luxi-Business-1.0"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
rhai = { version = "1", features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread","macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["json","rustls-tls"] }
tracing = "0.1"

[[bench]]
name = "edge_suite"
harness = false

[[bench]]
name = "my_benchmark"
harness = false

[[bench]]
name = "simd_vs_scalar"
harness = false

[dev-dependencies]
criterion = "0.7.0"
