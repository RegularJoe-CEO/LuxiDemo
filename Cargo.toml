[package]
name = "luxiedge"
version = "0.1.0"
edition = "2021"

[lib]
name = "erock"
path = "src/lib.rs"

[[bin]]
name = "gpu_benchmark"
path = "src/bin/gpu_benchmark.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
half = "2.4"
rhai = "1.16"
rand = "0.8"
rand_distr = "0.4"
serde = { version = "1.0", features = ["derive"] }

cudarc = { version = "0.17", default-features = false, optional = true, features = ["f16", "dynamic-loading"] }

[features]
gpu = ["cudarc"]
neural = []

