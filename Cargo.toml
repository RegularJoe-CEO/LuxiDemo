[workspace]
members = [
    "edge",
]
resolver = "2"

[package]
name = "erock"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1.0"

rhai = "1"
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "edge_suite"
harness = false

[[bench]]
name = "my_benchmark"
harness = false

[[bench]]
name = "simd_vs_scalar"
harness = false
