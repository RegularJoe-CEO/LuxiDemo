services:
  luxi-edge:
    build:
      context: .
      target: runtime
    container_name: luxi-edge
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 2s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  luxi-edge-bench:
    build:
      context: .
      target: bench
    container_name: luxi-edge-bench
    entrypoint: ["sleep", "infinity"]
    profiles: ["bench"]
